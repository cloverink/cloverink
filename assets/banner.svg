<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="cloverink — Aran Chananar, software engineer. Error Driven Development.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#0d1a2b"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#2a5ac0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2a5ac0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd0b4"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fd0b4"/>
      <stop offset="1" stop-color="#2a5ac0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <rect width="1200" height="400" fill="url(#glowGreen)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="400" fill="url(#glowBlue)">
      <animate attributeName="opacity" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- wordmark -->
    <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="152" font-size="84" font-weight="700" letter-spacing="4" fill="#ffffff">cloverink</text>
      <text x="76" y="186" font-size="15" font-weight="500" letter-spacing="5" fill="#8ea3c9">ARAN CHANANAR  ·  SOFTWARE ENGINEER</text>
      <text x="72" y="248" font-size="31" font-weight="500" letter-spacing="-0.4" fill="url(#brand)">Error Driven Development</text>

      <!-- the loop -->
      <g font-size="13" font-weight="500" fill="#d9e2f5">
        <rect x="72" y="282" width="64" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="104" y="301" text-anchor="middle">build</text>
        <text x="146" y="301" fill="#6f83aa">›</text>
        <rect x="160" y="282" width="68" height="30" rx="15" fill="#f07178" fill-opacity="0.12" stroke="#f07178" stroke-opacity="0.45"/>
        <text x="194" y="301" text-anchor="middle" fill="#ffb4b8">break</text>
        <text x="238" y="301" fill="#6f83aa">›</text>
        <rect x="252" y="282" width="52" height="30" rx="15" fill="#10b981" fill-opacity="0.12" stroke="#8fd0b4" stroke-opacity="0.45"/>
        <text x="278" y="301" text-anchor="middle" fill="#b8f0d4">fix</text>
        <text x="314" y="301" fill="#6f83aa">›</text>
        <rect x="328" y="282" width="78" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="367" y="301" text-anchor="middle">repeat</text>
      </g>
      <text x="72" y="352" font-size="14" fill="#6f83aa" letter-spacing="1">cloverink.com  ·  github.com/cloverink</text>
    </g>

    <!-- terminal card -->
    <g transform="translate(790 78)">
      <rect width="340" height="244" rx="18" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <!-- title bar -->
      <circle cx="22" cy="22" r="5" fill="#f07178" fill-opacity="0.9"/>
      <circle cx="40" cy="22" r="5" fill="#f5c26b" fill-opacity="0.9"/>
      <circle cx="58" cy="22" r="5" fill="#8fd0b4" fill-opacity="0.9"/>
      <text x="170" y="26" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#7f93bb">EDD — SESSION</text>
      <line x1="0" y1="40" x2="340" y2="40" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- status pill: ERROR ↔ FIXED -->
      <g transform="translate(262 12)">
        <rect width="62" height="20" rx="10" fill="#f07178" fill-opacity="0.18" stroke="#f07178" stroke-opacity="0.5">
          <animate attributeName="fill" values="#f07178;#f07178;#10b981;#10b981;#f07178" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="stroke" values="#f07178;#f07178;#8fd0b4;#8fd0b4;#f07178" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="31" y="14" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#ffb4b8">
          ERROR
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
        </text>
        <text x="31" y="14" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#b8f0d4" opacity="0">
          FIXED
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
        </text>
      </g>

      <!-- lines -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
        <text x="24" y="72" fill="#d9e2f5"><tspan fill="#8fd0b4">$</tspan> bun run dev</text>
        <text x="24" y="98" fill="#ffb4b8">error TS2339: Property 'ship'</text>
        <text x="24" y="118" fill="#ffb4b8">  does not exist on type 'Dev'.</text>
        <text x="24" y="148" fill="#8ea3c9">› read error. fix that. re-run.</text>
        <text x="24" y="178" fill="#b8f0d4">
          ✓ 0 errors  ·  ship it
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
        </text>
        <text x="24" y="212" fill="#d9e2f5"><tspan fill="#8fd0b4">$</tspan> git push origin feat/edd<tspan fill="#8fd0b4">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
      </g>
    </g>

    <!-- accent line -->
    <rect x="0" y="396" width="1200" height="4" fill="url(#line)">
      <animate attributeName="x" values="-600;600;-600" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
